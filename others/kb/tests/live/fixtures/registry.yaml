# WP-09 시험 레지스트리. kb live run --dry-run --sources 이 파일: 네트워크 없이 live.responses로 판정한다.
sources:
- id: src:live-test
  name: live test
  domain: [G]
  class: rel
  fetch: {kind: https, urls: ["https://api.github.com/repos/acme/old-tool", "https://raw.githubusercontent.com/acme/old-tool/HEAD/README.md"]}
  policy: {enabled: true, tos: allowed, tos_ref: "https://t.example/tos", robots: enforce, requires_decision: null, trust: primary,
           retention: permanent, pii: false, needs_contact: false}
live:
  targets:
  - {id: "e:repo:acme-old-tool", type: repo, label: acme/old-tool, props: {repo: acme/old-tool}, liveness: null}
  - {id: "e:package:left-pad", type: package, label: left-pad, props: {package: left-pad, registry: npm}, liveness: null}
  responses:
    "https://api.github.com/repos/acme/old-tool":
      status: 200
      body: {full_name: acme/old-tool, archived: true, pushed_at: "2026-12-01T00:00:00Z"}
    "https://raw.githubusercontent.com/acme/old-tool/HEAD/README.md":
      status: 200
      body: "# old-tool\n\nThis project has been archived. Moved to acme/new-tool.\n"
    "https://registry.npmjs.org/left-pad":
      status: 200
      body:
        dist-tags: {latest: "1.3.0"}
        versions: {"1.3.0": {deprecated: "Package no longer supported."}}
        time: {"1.3.0": "2026-12-01T00:00:00Z"}
