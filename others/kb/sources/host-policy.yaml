# 수집 호스트 정책. 거부 목록은 호출과 리다이렉트 홉마다 검사한다(ADR 10.3). 하위 도메인을 포함한다.
# overlay의 host_allow는 이 목록에서 그 호스트 하나만 뺀다(하위 도메인과 상위 도메인은 그대로 거부).
deny:
  # YouTube·Google 자동화 경로(사용자 결정 1: Trends RSS와 google.com 자동완성만 WP-24가 따로 다룬다)
  - youtube.com
  - youtu.be
  - youtube-nocookie.com
  - googlevideo.com
  - ytimg.com
  - suggestqueries.google.com
  - trends.google.com
  # 약관 또는 robots가 자동 접근을 막은 소스(ADR 10.4 forbidden)
  - sec.gov
  - netflix.com
  - kobaco.co.kr

# 호스트별 시간당 네트워크 요청 예산. robots.txt 요청도 센다.
budgets:
  api.github.com: 50

# 호스트별 최소 간격(초). 없으면 기본 3초.
intervals: {}
