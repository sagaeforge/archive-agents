# WP-07 소스 레지스트리(g5-sllm.yaml). 원본: ADR-0001 10.4, docs/research/sources-inventory*.md, ADR-0002.
# policy.reason: 비활성 사유 또는 주의. parse: 어댑터 설정. 비활성 소스는 enabled=false이고 수집 코드가 호출하지 않는다.
sources:
- id: src:hf-models
  inventory_id: L01
  name: Hugging Face Hub 조직별 모델
  domain:
  - G
  class: feed
  fetch:
    kind: https
    urls:
    - https://huggingface.co/api/models?author=unsloth&sort=lastModified&limit=50
    - https://huggingface.co/api/models?author=Qwen&sort=lastModified&limit=50
    - https://huggingface.co/api/models?author=google&sort=lastModified&limit=50
    - https://huggingface.co/api/models?author=LGAI-EXAONE&sort=lastModified&limit=50
    - https://huggingface.co/api/models?author=LiquidAI&sort=lastModified&limit=50
    conditional: true
  parser: hf_models@1
  expect:
    content_type: &id001
    - application/json
  policy:
    enabled: true
    tos: no_clause
    tos_ref: https://huggingface.co/terms-of-service
    robots: enforce
    requires_decision: null
    trust: secondary
    retention: permanent
    pii: false
    needs_contact: false
- id: src:llama-cpp-releases
  inventory_id: L02
  name: llama.cpp 릴리스
  domain:
  - G
  class: rel
  fetch:
    kind: https
    url: https://api.github.com/repos/ggml-org/llama.cpp/releases/latest
    conditional: true
  parser: github_release@1
  parse:
    entity:
      slug: llama-cpp
      label: llama.cpp
      type: Tool
  expect:
    content_type: *id001
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
