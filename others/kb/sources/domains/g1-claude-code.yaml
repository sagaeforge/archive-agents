# WP-07 소스 레지스트리(g1-claude-code.yaml). 원본: ADR-0001 10.4, docs/research/sources-inventory*.md, ADR-0002.
# policy.reason: 비활성 사유 또는 주의. parse: 어댑터 설정. 비활성 소스는 enabled=false이고 수집 코드가 호출하지 않는다.
sources:
- id: src:cc-changelog-gh
  inventory_id: C01
  name: Claude Code CHANGELOG
  domain:
  - G
  class: rel
  fetch:
    kind: https
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    conditional: true
  parser: changelog_md@1
  parse:
    entity:
      slug: claude-code
      label: Claude Code
      type: Tool
  expect:
    content_type:
    - text/plain
    - text/markdown
    min_bytes: 300000
    entries_never_shrink: true
  fallbacks:
  - src:cc-changelog-docs
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
- id: src:cc-changelog-docs
  inventory_id: C02
  name: Claude Code 문서 Changelog RSS
  domain:
  - G
  class: rel
  fetch:
    kind: https
    url: https://code.claude.com/docs/en/changelog/rss.xml
    conditional: true
  parser: rss_atom@1
  expect:
    content_type: &id002
    - application/rss+xml
    - application/atom+xml
    - application/xml
    - text/xml
    - text/plain
  fallbacks:
  - src:cc-changelog-gh
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://code.claude.com/docs/llms.txt
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
