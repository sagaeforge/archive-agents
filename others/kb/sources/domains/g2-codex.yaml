# WP-07 소스 레지스트리(g2-codex.yaml). 원본: ADR-0001 10.4, docs/research/sources-inventory*.md, ADR-0002.
# policy.reason: 비활성 사유 또는 주의. parse: 어댑터 설정. 비활성 소스는 enabled=false이고 수집 코드가 호출하지 않는다.
sources:
- id: src:codex-releases
  inventory_id: O01
  name: openai/codex 릴리스
  domain:
  - G
  class: rel
  fetch:
    kind: https
    url: https://api.github.com/repos/openai/codex/releases/latest
    conditional: true
  parser: github_release@1
  parse:
    entity:
      slug: codex-cli
      label: Codex CLI
      type: Tool
  expect:
    content_type: &id002
    - application/json
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
- id: src:codex-docs
  inventory_id: O02
  name: Codex 공식 문서
  domain:
  - G
  class: docs
  fetch:
    kind: https
    url: https://learn.chatgpt.com/docs/llms.txt
    discover:
      kind: llms_txt
      max_pages: 220
      max_depth: 2
      include:
      - ^https://learn\.chatgpt\.com/docs/
    conditional: true
  parser: llms_txt@1
  expect:
    content_type: &id001
    - text/plain
    - text/markdown
    - text/html
    - application/xhtml+xml
  policy:
    enabled: true
    tos: signals_conflict
    tos_ref: https://openai.com/policies/terms-of-use/
    robots: enforce
    requires_decision: 9
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
- id: src:codex-changelog
  inventory_id: O03
  name: Codex 변경 이력 RSS
  domain:
  - G
  class: rel
  fetch:
    kind: https
    url: https://learn.chatgpt.com/docs/changelog/rss.xml
    conditional: true
  parser: rss_atom@1
  expect:
    content_type: &id003
    - application/rss+xml
    - application/atom+xml
    - application/xml
    - text/xml
    - text/plain
  policy:
    enabled: true
    tos: signals_conflict
    tos_ref: https://openai.com/policies/terms-of-use/
    robots: enforce
    requires_decision: 9
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
