# WP-07 소스 레지스트리(g3-usage.yaml). 원본: ADR-0001 10.4, docs/research/sources-inventory*.md, ADR-0002.
# policy.reason: 비활성 사유 또는 주의. parse: 어댑터 설정. 비활성 소스는 enabled=false이고 수집 코드가 호출하지 않는다.
sources:
- id: src:cc-best-practices
  inventory_id: U01
  name: Claude Code Best practices
  domain:
  - G
  class: docs
  fetch:
    kind: https
    url: https://code.claude.com/docs/en/best-practices.md
    conditional: true
  parser: page_md@1
  expect:
    content_type: &id001
    - text/plain
    - text/markdown
    - text/html
    - application/xhtml+xml
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://code.claude.com/docs/llms.txt
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
