- id: src:awesome-claude-code
  inventory_id: U04
  name: awesome-claude-code 자료 표(CSV)
  domain:
  - G
  class: feed
  fetch:
    kind: https
    url: https://raw.githubusercontent.com/hesreallyhim/awesome-claude-code/main/THE_RESOURCES_TABLE_NEW.csv
    conditional: true
  parser: csv@1
  parse:
    label: Display Name
    link: Link
    type: Tool
    prefix: awesome-cc
    active: Active
    prose:
    - Description
  expect:
    content_type:
    - text/plain
    - text/csv
    min_bytes: 20000
  policy:
    enabled: true
    tos: allowed
    tos_ref: https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
    robots: enforce
    requires_decision: null
    trust: secondary
    retention: permanent
    pii: false
    needs_contact: false
