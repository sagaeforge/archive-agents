# WP-07 소스 레지스트리(g4-ecosystem.yaml). 원본: ADR-0001 10.4, docs/research/sources-inventory*.md, ADR-0002.
# policy.reason: 비활성 사유 또는 주의. parse: 어댑터 설정. 비활성 소스는 enabled=false이고 수집 코드가 호출하지 않는다.
sources:
- id: src:mcp-registry
  inventory_id: M21
  name: MCP Registry
  domain:
  - G
  class: weekly
  fetch:
    kind: https
    url: https://registry.modelcontextprotocol.io/v0/servers?limit=100
    conditional: true
  parser: mcp_registry@1
  expect:
    content_type: &id001
    - application/json
  policy:
    enabled: true
    tos: unverified
    tos_ref: null
    robots: enforce
    requires_decision: null
    trust: primary
    retention: permanent
    pii: false
    needs_contact: false
