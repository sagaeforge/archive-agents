# 결정 1(ADR-0002) 답: Trends RSS(P09c)와 google.com 자동완성(P04)만 켠다. 키와 계정은 쓰지 않는다.
# host_allow는 host-policy 거부 목록에서 그 호스트 하나만 뺀다. youtube.com 계열과 suggestqueries.google.com은 그대로 거부한다.
host_allow:
  - trends.google.com
  - www.google.com
sources:
  - id: src:google-trends
    inventory_id: P09
    name: Google Trends 일별 급상승 검색어 RSS (P09c)
    domain: [A, B]
    class: short
    fetch:
      kind: https
      urls:
        - https://trends.google.com/trending/rss?geo=KR
        - https://trends.google.com/trending/rss?geo=US
    parser: trends_rss@1
    expect:
      content_type: [application/xml, text/xml, application/rss+xml]
    policy:
      enabled: true
      tos: unverified
      tos_ref: https://policies.google.com/terms
      robots: enforce
      requires_decision: 1
      trust: primary
      reason: "결정 1 답으로 켠다. Explore(P09a), 내부 API(P09b)는 쓰지 않는다. 급상승 검색어이고 YouTube 검색량이 아니다. 인용 시 Google Trends 귀속 표기"
  - id: src:yt-suggest
    inventory_id: P04
    name: Google 자동완성 (google.com 호스트, 키 없음)
    domain: [A, D]
    class: short
