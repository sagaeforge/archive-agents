components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: TCP에서만 필수. Unix 소켓은 파일 권한이다(계약 7장).
  parameters:
    Types:
      name: types
      in: query
      required: false
      description: 타입 이름. 쉼표로 여러 값을 주면 OR다(계약 4장 표 문법). 생략하면 경로별 기본이다(계약 2.7 `기본 types`). 명시하면 기본을 대체한다.
      schema:
        type: string
    EdgeStatus:
      name: edge_status
      in: query
      required: false
      description: 엣지에만 거는 상태. 쉼표로 `active`, `superseded`, `dead`, `all` 여러 값을 준다. 생략하면 `status`와 같다. 노드 집합과 `node_total`은 `status`만 따른다. 허용 밖 값은 400 `bad_param`(계약 2.7).
      schema:
        type: string
        pattern: ^(active|superseded|dead|all)(,(active|superseded|dead|all))*$
    Origin:
      name: origin
      in: query
      required: false
      description: 출처 구분 `external`, `first_party`. 쉼표로 여러 값을 주면 OR다.
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      description: 응답 `status` 필터(2.7). 단일 값이고 기본은 `active`만이다. 엣지만 다른 값으로 받으려면 `edge_status`를 쓴다.
      schema:
        type: string
        enum:
        - active
        - superseded
        - dead
        - all
        default: active
    Domain:
      name: domain
      in: query
      required: false
      description: 수집 도메인 A~G. any-of다. 노드의 `domain`이 나열한 값 중 하나라도 담으면 맞는다. `none`은 `domain=[]`인 노드와 맞고 `G,none`처럼 섞는다(계약 2.7).
      schema:
        type: string
    Source:
      name: source
      in: query
      required: false
      description: 소스 ID(`src:<slug>`). 쉼표로 여러 값을 주면 OR다.
      schema:
        type: string
    Author:
      name: author
      in: query
      required: false
      description: 사용자 기록 작성자. 쉼표로 여러 값을 주면 OR다.
      schema:
        type: string
    IncludeUnverified:
      name: include_unverified
      in: query
      required: false
      description: '`true`면 `needs_review`, `unverified` 주장을 더한다(2.7).'
      schema:
        type: boolean
        default: false
    AsOfValid:
      name: as_of_valid
      in: query
      required: false
      description: 유효축 시점. RFC 3339 또는 `YYYY-MM-DD`(그날 00:00Z). 줄 때만 유효축을 건다(2.9). 빈 값은 400 `bad_param`.
      schema:
        type: string
        minLength: 1
        pattern: '^\d{4}-\d{2}-\d{2}([Tt]\d{2}:\d{2}:\d{2}(\.\d+)?([Zz]|[+-]\d{2}:\d{2}))?$'
    AsOfObserved:
      name: as_of_observed
      in: query
      required: false
      description: 관측축 시점. RFC 3339. 생략하면 현재(2.9).
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: 불투명 커서(2.4). 응답 `page.next_cursor`를 그대로 넘긴다. 소비자가 만들거나 해석하지 않는다.
      schema:
        type: string
    LimitList:
      name: limit
      in: query
      required: false
      description: 페이지당 항목 수. 기본 100, 최대 500. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    LimitSearch:
      name: limit
      in: query
      required: false
      description: 페이지당 항목 수. 기본 50, 최대 200. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LimitChanges:
      name: limit
      in: query
      required: false
      description: 페이지당 항목 수. 기본 500, 최대 5,000. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 500
    LimitOverview:
      name: limit
      in: query
      required: false
      description: 페이지당 노드 상한. 기본 50,000, 최대 100,000. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 50000
    EdgeLimitOverview:
      name: edge_limit
      in: query
      required: false
      description: 페이지당 엣지 상한. 기본 200,000, 최대 400,000. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 400000
        default: 200000
    LimitNeighbors:
      name: limit
      in: query
      required: false
      description: 노드 수 상한. 기본 200, 최대 500. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    EdgeLimitNeighbors:
      name: edge_limit
      in: query
      required: false
      description: 엣지 수 상한. 기본 2,000, 최대 10,000. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 2000
    ClaimLimitDetail:
      name: claim_limit
      in: query
      required: false
      description: 내장 `claims` 상한. 기본 50, 최대 200. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    EdgeLimitDetail:
      name: edge_limit
      in: query
      required: false
      description: 내장 `edges` 상한. 기본 100, 최대 500. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    BacklinkLimitDetail:
      name: backlink_limit
      in: query
      required: false
      description: 내장 `backlinks` 상한. 기본 100, 최대 500. 상한 초과는 400 `limit_too_large`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Rtypes:
      name: rtypes
      in: query
      required: false
      description: 관계 타입 필터. 쉼표로 여러 값을 주면 OR다.
      schema:
        type: string
    Type:
      name: type
      in: query
      required: false
      description: 값 하나의 `types`. `types`와 함께 주면 400 `bad_param`.
      schema:
        type: string
    Ids:
      name: ids
      in: query
      required: false
      description: 노드 ID를 쉼표로 최대 100개. 일괄 읽기이고 `as_of_*` 외 다른 파라미터와 함께 쓰지 않는다.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: '`name:op:value`. 반복하면 AND다. 첫 두 `:`만 구분자이고 값은 퍼센트 인코딩한다(4장 표 문법).'
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Sort:
      name: sort
      in: query
      required: false
      description: '`key` 또는 `-key`(내림차순). 키는 `/v1/schema`의 `sort_keys`. 기본은 `id` 오름차순.'
      schema:
        type: string
    Include:
      name: include
      in: query
      required: false
      description: 쉼표로 `claims`, `edges`, `backlinks`, `body`를 고른다. 기본 `claims,edges`.
      schema:
        type: string
    Predicate:
      name: predicate
      in: query
      required: false
      description: 술어 ID. 그 술어의 주장(체인)만 준다.
      schema:
        type: string
    Direction:
      name: direction
      in: query
      required: false
      description: 엣지 방향.
      schema:
        type: string
        enum:
        - out
        - in
        - both
        default: both
    Depth:
      name: depth
      in: query
      required: false
      description: 이웃 깊이.
      schema:
        type: integer
        minimum: 1
        maximum: 2
        default: 1
    Start:
      name: start
      in: query
      required: false
      description: 본문 시작 오프셋. 코드포인트.
      schema:
        type: integer
        minimum: 0
        default: 0
    MaxChars:
      name: max_chars
      in: query
      required: false
      description: 본문 창 크기. 코드포인트. 기본 20,000, 최대 200,000.
      schema:
        type: integer
        minimum: 1
        maximum: 200000
        default: 20000
    Q:
      name: q
      in: query
      required: true
      description: 검색어. NFC 정규화 후 KB 안에서 토크나이징한다. 토큰이 하나도 없으면 400 `bad_param`.
      schema:
        type: string
        minLength: 1
    QOptional:
      name: q
      in: query
      required: false
      description: 검색어(선택). 주면 전체 일치에서 센다(4.9). NFC 정규화 후 KB 안에서 토크나이징한다. 토큰이 하나도 없으면 400 `bad_param`.
      schema:
        type: string
        minLength: 1
    Mode:
      name: mode
      in: query
      required: false
      description: 검색 방식. `hybrid`가 불가능하면 `degraded`에 `lexical_only`.
      schema:
        type: string
        enum:
        - lexical
        - hybrid
        default: lexical
    HitKinds:
      name: kinds
      in: query
      required: false
      description: 결과 종류. 쉼표로 여러 값을 주면 OR다.
      schema:
        type: string
        default: claim,record,entity,passage
    CountBucket:
      name: bucket
      in: query
      required: false
      description: 집계 버킷.
      schema:
        type: string
        enum:
        - day
        - week
        - month
    CountField:
      name: field
      in: query
      required: false
      description: 집계 기준 필드.
      schema:
        type: string
        enum:
        - recorded_at
        - valid_from
    SeriesFrom:
      name: from
      in: query
      required: false
      description: 구간 시작. RFC 3339 또는 `YYYY-MM-DD`.
      schema:
        type: string
    SeriesTo:
      name: to
      in: query
      required: false
      description: 구간 끝. RFC 3339 또는 `YYYY-MM-DD`.
      schema:
        type: string
    SeriesBucket:
      name: bucket
      in: query
      required: false
      description: 주면 버킷마다 마지막 점 하나를 준다. 평균이나 합을 내지 않는다.
      schema:
        type: string
        enum:
        - day
        - week
        - month
    ChangeKinds:
      name: kinds
      in: query
      required: false
      description: 이벤트 종류(ADR 7.1)와 `visibility.revoked`. 쉼표로 여러 값을 주면 OR다. `visibility.revoked`는 이 필터와 무관하게 항상 나온다.
      schema:
        type: string
    ChangeOrigin:
      name: origin
      in: query
      required: false
      description: 이벤트 출처.
      schema:
        type: string
        enum:
        - external
        - first_party
        - system
    Profile:
      name: profile
      in: query
      required: false
      description: export 프로필(5장).
      schema:
        type: string
        enum:
        - core
        - full
        default: core
    TicketStatus:
      name: status
      in: query
      required: false
      description: 티켓 상태.
      schema:
        type: string
    NodeId:
      name: id
      in: path
      required: true
      description: 노드 ID(계약 2.10 표의 모든 노드 종류).
      schema:
        $ref: '#/components/schemas/PublicId'
      examples:
        entity:
          summary: 엔티티
          value: e:feature:claude-code-ultraplan
        claim:
          summary: 주장
          value: c-8k2p4q7m1xab
        record:
          summary: 사용자 기록
          value: f-01JC8ZQ3T9XYZ
        snapshot:
          summary: 스냅샷
          value: n-3fa9c01b77aa12ef
        series:
          summary: 시계열
          value: s:kworb-yt-daily-kr
    ClaimId:
      name: id
      in: path
      required: true
      description: 주장 ID(`c-...`). 다른 종류는 404.
      schema:
        $ref: '#/components/schemas/PublicId'
      examples:
        claim:
          summary: 주장
          value: c-8k2p4q7m1xab
    EdgeId:
      name: id
      in: path
      required: true
      description: 엣지 ID(`r-...`). 다른 종류는 404.
      schema:
        $ref: '#/components/schemas/PublicId'
      examples:
        edge:
          summary: 엣지
          value: r-1a2b3c4d5e6f
    SeriesId:
      name: id
      in: path
      required: true
      description: 시계열 ID(`s:<slug>`).
      schema:
        $ref: '#/components/schemas/PublicId'
      examples:
        series:
          summary: 시계열
          value: s:kworb-yt-daily-kr
    SnapshotId:
      name: id
      in: path
      required: true
      description: 스냅샷 ID(`n-...`).
      schema:
        $ref: '#/components/schemas/PublicId'
      examples:
        snapshot:
          summary: 스냅샷
          value: n-3fa9c01b77aa12ef
  headers:
    ETag:
      description: 데이터 경로는 `"<epoch>-<applied_seq>-<build_id>"`(2.5).
      schema:
        type: string
    CacheControl:
      description: 경로 구분별 `no-cache`, `no-store`(2.5).
      schema:
        type: string
  responses:
    NotModified:
      description: '`If-None-Match`가 맞다. 본문 없음.'
    BadRequest:
      description: '파라미터 오류: `bad_param`, `limit_too_large`, `cursor_mismatch`, `as_of_unsupported`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/bad-param
                title: unknown query parameter
                status: 400
                code: bad_param
    Unauthorized:
      description: '`token_required`, `token_invalid`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/token-required
                title: token required
                status: 401
                code: token_required
    Forbidden:
      description: '`host_rejected`: Host 헤더 불일치.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/host-rejected
                title: host rejected
                status: 403
                code: host_rejected
    NotFound:
      description: '`not_found`: 없음, 민감도로 숨김, 형식이 틀린 ID.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/not-found
                title: not found
                status: 404
                code: not_found
    MethodNotAllowed:
      description: '`method_not_allowed`: `GET`, `HEAD` 외 메서드.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/method-not-allowed
                title: method not allowed
                status: 405
                code: method_not_allowed
    Gone:
      description: '`epoch_changed`, `content_removed`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/epoch-changed
                title: epoch changed
                status: 410
                code: epoch_changed
    RangeNotSatisfiable:
      description: '`range_not_satisfiable`: `Range`가 범위 밖.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/range-not-satisfiable
                title: range not satisfiable
                status: 416
                code: range_not_satisfiable
    TooManyRequests:
      description: '`too_many_requests`: 동시 처리 요청이 상한을 넘었다.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/too-many-requests
                title: too many requests
                status: 429
                code: too_many_requests
      headers:
        Retry-After:
          description: 다시 시도까지 초.
          required: true
          schema:
            type: integer
            minimum: 0
    InternalError:
      description: '`internal`: 처리 중 예외.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/internal
                title: internal error
                status: 500
                code: internal
    Unavailable:
      description: '`read_timeout`, `not_ready`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://kb.local/problems/not-ready
                title: not ready
                status: 503
                code: not_ready
      headers:
        Retry-After:
          description: 다시 시도까지 초.
          required: true
          schema:
            type: integer
            minimum: 0
  schemas:
    PublicId:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9:._-]*$
      description: 공개 ID(계약 2.10). 경로에 그대로 넣거나 퍼센트 인코딩한다.
    Origin:
      type: string
      enum:
      - external
      - first_party
    Status:
      type: string
      enum:
      - active
      - superseded
      - dead
    Sensitivity:
      type: string
      enum:
      - public
      - internal
      - private
      - secret
    SelectorKind:
      type: string
      enum:
      - text_quote
      - jsonpointer
    EvidenceState:
      type: string
      enum:
      - live
      - archived_only
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        instance:
          type: string
        param:
          type: string
          description: bad_param의 파라미터 이름
    Envelope:
      type: object
      required:
      - schema_version
      - epoch
      - build_id
      - data_as_of
      - applied_seq
      - as_of
      - degraded
      properties:
        schema_version:
          type: string
        epoch:
          type: integer
          minimum: 1
        build_id:
          type: string
        data_as_of:
          type:
          - string
          - 'null'
          format: date-time
        applied_seq:
          type: integer
          minimum: 0
        as_of:
          type: object
          required:
          - valid
          - observed
          properties:
            valid:
              type:
              - string
              - 'null'
              format: date-time
            observed:
              type:
              - string
              - 'null'
              format: date-time
        degraded:
          type: array
          items:
            type: string
    Page:
      type: object
      required:
      - next_cursor
      - total
      - truncated
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
          minimum: 0
        truncated:
          type: boolean
    ValidTime:
      type: object
      properties:
        from:
          type:
          - string
          - 'null'
        to:
          type:
          - string
          - 'null'
        precision:
          type:
          - string
          - 'null'
          enum:
          - instant
          - day
          - month
          - quarter
          - year
          - null
        label:
          type:
          - string
          - 'null'
    SourceRef:
      type: object
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
        trust:
          type: string
    Node:
      type: object
      required:
      - id
      - type
      - label
      - origin
      - status
      - sensitivity
      - version
      - recorded_at
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
        status:
          $ref: '#/components/schemas/Status'
        liveness:
          type:
          - string
          - 'null'
        verification:
          type:
          - string
          - 'null'
        link_status:
          type:
          - string
          - 'null'
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        domain:
          type: array
          items:
            type: string
        version:
          type: integer
        merged_into:
          type:
          - string
          - 'null'
        merged_into_final:
          type:
          - string
          - 'null'
        valid:
          $ref: '#/components/schemas/ValidTime'
        recorded_at:
          type: string
          format: date-time
        expired_at:
          type:
          - string
          - 'null'
          format: date-time
        author:
          type:
          - string
          - 'null'
        generated_by:
          type:
          - string
          - 'null'
        on_behalf_of:
          type:
          - string
          - 'null'
        body_format:
          type:
          - string
          - 'null'
        body:
          type:
          - string
          - 'null'
        body_chars:
          type:
          - integer
          - 'null'
        props:
          type: object
    NodeList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
    Edge:
      type: object
      required:
      - id
      - src
      - dst
      - rtype
      - status
      - sensitivity
      - version
      properties:
        id:
          type: string
        src:
          type: string
        dst:
          type: string
        rtype:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        version:
          type: integer
        claim_id:
          type:
          - string
          - 'null'
        valid:
          $ref: '#/components/schemas/ValidTime'
        recorded_at:
          type: string
          format: date-time
        expired_at:
          type:
          - string
          - 'null'
          format: date-time
        props:
          type: object
    NodeRef:
      type: object
      required:
      - id
      - type
      - label
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
    EdgeRef:
      type: object
      required:
      - id
      - rtype
      - src
      - dst
      - status
      properties:
        id:
          type: string
        rtype:
          type: string
        src:
          type: string
        dst:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        claim_id:
          type:
          - string
          - 'null'
        peer:
          $ref: '#/components/schemas/NodeRef'
    EdgeRefList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EdgeRef'
    EdgeGroups:
      type: object
      required:
      - out
      - in
      - truncated
      properties:
        out:
          type: array
          items:
            $ref: '#/components/schemas/EdgeRef'
        in:
          type: array
          items:
            $ref: '#/components/schemas/EdgeRef'
        truncated:
          type: boolean
    Backlink:
      type: object
      required:
      - id
      - type
      - label
      - rtype
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        rtype:
          type: string
    Evidence:
      type: object
      required:
      - id
      - snapshot_id
      - selector_kind
      - evidence_state
      properties:
        id:
          type: string
        snapshot_id:
          type: string
        selector_kind:
          $ref: '#/components/schemas/SelectorKind'
        exact:
          type:
          - string
          - 'null'
        prefix:
          type:
          - string
          - 'null'
        suffix:
          type:
          - string
          - 'null'
        start:
          type:
          - integer
          - 'null'
          description: 표시 본문 코드포인트, 포함
        end:
          type:
          - integer
          - 'null'
          description: 표시 본문 코드포인트, 미포함
        json_pointer:
          type:
          - string
          - 'null'
        evidence_state:
          $ref: '#/components/schemas/EvidenceState'
        support_check:
          type:
          - string
          - 'null'
        last_confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
    Claim:
      allOf:
      - $ref: '#/components/schemas/Node'
      - type: object
        required:
        - subject
        - statement
        - kind
        - stance
        - method
        properties:
          subject:
            type: string
          predicate:
            type:
            - string
            - 'null'
          object:
            type:
            - string
            - 'null'
          value:
            type:
            - string
            - 'null'
          unit:
            type:
            - string
            - 'null'
          qualifiers:
            type: object
          own_status:
            $ref: '#/components/schemas/Status'
