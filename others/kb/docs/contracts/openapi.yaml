      required:
      - fp_gate
      - editor_routes
      - private_open
      - hitl
      - secret_rules
      additionalProperties: false
      allOf:
      - if:
          properties:
            secret_rules:
              properties:
                version:
                  type: 'null'
        then:
          properties:
            editor_routes:
              maxItems: 0
