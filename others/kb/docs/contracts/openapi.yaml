          type: boolean
        editor_routes:
          type: array
          items:
            type: string
            pattern: ^(GET|POST|PUT|DELETE) /v1/[^ ]+$
          uniqueItems: true
        private_open:
          type: boolean
        hitl:
          $ref: '#/components/schemas/HitlReadiness'
        secret_rules:
