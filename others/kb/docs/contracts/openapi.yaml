    HitlReadiness:
      type: object
      properties:
        available:
          type: boolean
        trust_store:
          type: string
          enum:
          - ready
          - missing
          - unreadable
          - unsafe
        rp_ids:
          type: array
          items:
            type: object
            properties:
              rp_id:
                type: string
              allowed_origins:
                type: array
                items:
                  type: string
                  format: uri
              registered:
                type: boolean
            required:
            - rp_id
            - allowed_origins
            - registered
            additionalProperties: false
      required:
      - available
      - trust_store
      - rp_ids
      additionalProperties: false
      allOf:
      - if:
          properties:
            trust_store:
              enum:
              - missing
              - unreadable
              - unsafe
        then:
          properties:
            available:
              const: false
            rp_ids:
              maxItems: 0
    WriteReadiness:
      type: object
      properties:
