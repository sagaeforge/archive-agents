# KB 데이터 인터페이스 계약 v0 (OpenAPI 3.1.1 + JSON Schema 2020-12)
# 원본이다. docs/contracts/data-interface-v0.md는 설명 문서이고 어긋나면 이 파일이 이긴다.
# 기준선: docs/contracts/baseline/openapi.yaml (바꾸는 절차는 계약 8장).
openapi: 3.1.1
info:
  title: KB 데이터 인터페이스
  version: 0.5.0
  summary: 지식 저장소 읽기 및 승인된 first_party 쓰기 계약 v0
  description: 기계 판독 원본이다. `docs/contracts/data-interface-v0.md`는 설명 문서이고 둘이 어긋나면 이 파일이 이긴다. `paths`는 기존 읽기 경로와 0.5.0 reviewer/HITL/사용자 동작 계약을 담는다. 계약 선언은 운영 배포나 실물 WebAuthn 검증 완료를 뜻하지 않는다. 미배포 first_party 경로는 `x-first-party-paths`의 Path Item으로 고정한다. 준비 상태는 Meta.write 한 정의를 따른다. 서버 주소는 선언하지 않는다(Unix 소켓이 기본, TCP는 원격 이전 때). 저장소는 데이터만 제공하며 점수와 추천을 내지 않는다. 모르는 필드와 열린 값은 무시한다. `x-provisional`이 붙은 구간은 잠정이다(`/v1/ops/*`).
