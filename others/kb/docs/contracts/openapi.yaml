  /v1/actions:
    post:
      operationId: prepareUserAction
      tags:
        - reviewer
      summary: 사용자 동작 준비
      x-shape-evidence: ADR-0005:628; tests/fpapi/test_publish_async.py:226-228
      description: ADR-0005 5.10/6.8 및 결정 9. 소켓/TCP 모두 reviewer Bearer 필수. 성공은 평면 객체,
        시각은 RFC 3339 UTC. 계약 사례는 합성이며 실행 증거가 아니다.
      security:
        - reviewerBearer: []
      responses:
        '415':
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store
          description: Content-Type은 application/json이어야 한다. 415 unsupported_media_type의 고정 detail은 버그다(ADR-0005 7.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FirstPartyProblem'
        "201":
          description: release/declassify는 동기 준비 201. 내용은 release 응답에 싣지 않는다.
          headers:
            Cache-Control: &a1
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerPrepared"
              examples:
                release-prepare:
                  value: &a4
                    action_id: a-fixture-publish
                    state: ready
                    status_url: /v1/actions/a-fixture-publish
                declassify-prepare:
                  value: &a5
                    action_id: a-fixture-publish
                    state: ready
                    status_url: /v1/actions/a-fixture-publish
        "202":
          description: publish는 로컬 준비만 접수. 외부 호출/공개 0.
          headers:
            Cache-Control: *a1
            Location:
              required: true
              schema:
                type: string
                pattern: ^/v1/actions/[^/]+$
            Retry-After:
              required: true
              schema:
                type: string
                const: "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerPrepared"
              examples:
                publish-prepare:
                  value: &a3
                    action_id: a-fixture-publish
                    state: preparing
                    status_url: /v1/actions/a-fixture-publish
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 잘못된 증명은 review_unverified. 무동의 전송은 external_consent_required.
          headers:
            Cache-Control: &a2
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ReviewerProblem"
              examples:
                prepareUserAction-denied:
                  value: &a8
                    type: https://kb.local/problems/scope-denied
                    title: scope denied
                    status: 403
                    code: scope_denied
                    detail: KB 쓰기 권한이 없습니다. 토큰을 다시 설정하세요
                    instance: /v1/actions
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 대상 판/상태/결과 변경과 준비 만료는 review_stale; 준비 중은 write_in_flight.
          headers:
            Cache-Control: *a2
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ReviewerProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: 불안전·누락·읽기 실패 신뢰 저장소는 review_trust_unavailable. 경로/키/자격 증명을 반사하지 않는다.
          headers:
            Cache-Control: *a2
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ReviewerProblem"
              examples:
                review_trust_unavailable:
                  value: &a6
                    type: https://kb.local/problems/review-trust-unavailable
                    title: review trust unavailable
