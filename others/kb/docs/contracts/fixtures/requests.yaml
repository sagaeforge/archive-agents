    empty_search: 빈 검색 결과
    cursor_mismatch: cursor_mismatch
    epoch_changed: epoch_changed
    export_follow: export 뒤 changes_cursor로 이어 받기
    tail_cursor: 꼬리의 문자열 커서
    series_reannounce: 시계열 재공시
