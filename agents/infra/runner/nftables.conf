#!/usr/sbin/nft -f
# Network policy for the GitHub Actions runner LXC. provision.sh installs this
# file as /etc/nftables.conf and checks it before the runner registers. Jobs run
# as the runner account, which cannot change it.
#
# Nothing connects in. Going out, the LXC reaches DNS, the PVE API on every node
# for failover, and port 443 outside the private ranges. SSH to the nodes and
# the rest of the LAN are rejected, so a blocked connection fails at once
# instead of hanging a job. IPv6 is not used at all.

flush ruleset

define PVE_NODES = { 192.0.2.1, 192.0.2.1, 192.0.2.1 }

# The nodes resolve through 1.1.1.1. The gateway stays listed for a DHCP lease
# that hands it out as the resolver.
define DNS_SERVERS = { 1.1.1.1, 192.0.2.1 }

define NON_PUBLIC = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.168.x.x/16, 224.0.0.0/3 }

table inet runner {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept

        # DHCP lease renewal.
        udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oif "lo" accept
        ct state established,related accept

        # DHCP lease renewal.
        udp sport 68 udp dport 67 accept

        ip daddr $DNS_SERVERS udp dport 53 accept
        ip daddr $DNS_SERVERS tcp dport 53 accept

        # Read-only PVE API.
        ip daddr $PVE_NODES tcp dport 8006 accept

        # Must stay above the port 443 rule, or that rule opens the LAN.
        ip daddr $NON_PUBLIC reject

        # GitHub, npm, Node downloads and the Debian mirrors.
        meta nfproto ipv4 tcp dport 443 accept

        reject
    }
}
